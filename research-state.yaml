project:
  title: "ACPD LoRA distillation on RTX 5090"
  question: "Can paper-faithful ACPD distillation train a LoRA pi0.5 student with effective batch size 32 on four 32 GB RTX 5090 GPUs?"
  status: active
  started: "2026-09-11"
  domain: "robot policy distillation"

literature:
  key_papers:
    - id: acpd2027
      title: "AAAI 2027 ACPD manuscript"
      source: "AAAI_2027_ACPD.pdf"
      relevance: "Defines the privileged-cue selector, variance regularizer, ACL, and training objective."
  open_problems:
    - "Memory and throughput of a frozen full teacher plus a LoRA student on four 32 GB GPUs."
  evidence_gaps:
    - "Long-run stability and final task success of the four view-specific students are not measured yet."
    - "The trainer-matched 2K component runs have no saved checkpoints, so unchanged supervised loss cannot determine task-success effects."
    - "The manuscript's Table 2 mixes gated and ungated V6 runs, confounding the claimed Cue, ACL, and wrist-view ablations."

hypotheses:
  - id: H1
    statement: "FSDP4 with global micro-batch 8 and four accumulation steps can run ACPD LoRA with effective batch size 32 without OOM."
    status: supported
    motivation: "LoRA removes most student optimizer state while FSDP shards both model states and rematerialization limits activations."
    parent: null
    priority: high
  - id: H2
    statement: "FSDP4 can increase the physical global batch to 32 without gradient accumulation or OOM."
    status: supported
    motivation: "H1 left enough memory headroom to test the complete batch in one optimizer step."
    parent: H1
    priority: high
  - id: H3
    statement: "ACPD at layers 6 and 12 converges faster during the first 5K backview steps than ACPD at either layer alone."
    status: not_supported
    motivation: "The paper selects both layers without reporting a layer ablation; a controlled short run can test whether the additional head improves early optimization."
    parent: H2
    priority: high
  - id: H4
    statement: "Under an otherwise identical LoRA training graph, Cue or ACL changes early supervised-loss convergence relative to flow-only training."
    status: not_supported
    motivation: "The layer comparison cannot establish ACPD efficacy, and the historical SFT log uses a different RNG split. A component ablation inside the same distillation trainer isolates the optimization effect."
    parent: H2
    priority: high
  - id: H5
    statement: "Full ACPD improves pooled four-suite backview success by at least 2 percentage points over trainer-matched Flow-only training at 5K steps."
    status: active
    motivation: "H4 shows active auxiliary gradients but indistinguishable supervised convergence, so task success is the next discriminating measurement."
    parent: H4
    priority: high
  - id: H6
    statement: "A frozen backview student can predict teacher visual attention messages without teacher action-token shortcuts."
    status: active
    motivation: "The current cue loss is solved through teacher action memory; a visual-only probe tests whether privileged visual information is recoverable before a new policy run."
    parent: H5
    priority: high

experiments:
  proxy_metric: "Two finite optimizer steps with nonzero selector gradients and peak GPU memory below 32 GB."
  baseline_value: null
  best_value: null
  total_runs: 2
  trajectory:
    - run_id: acpd-lora-5090-smoke-126759
      batch_size: 8
      gradient_accumulation_steps: 4
      peak_gpu_memory_mib: 17291
      status: completed
    - run_id: acpd-lora-5090-physical-bs32-126936
      batch_size: 32
      gradient_accumulation_steps: 1
      peak_gpu_memory_mib: 17337
      status: completed

outer_loop:
  cycle: 5
  last_direction: "run a 500-step visual-only privileged-message probe before changing the policy objective"
  last_reflection: "The existing selector reaches near-perfect cue cosine while using teacher action tokens as a shortcut. H6 tests whether the backview can recover the teacher's visual message without that shortcut."

