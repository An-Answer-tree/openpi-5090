project:
  title: "ACPD LoRA distillation on RTX 5090"
  question: "How can privileged agentview+wrist information train a stronger weak-view pi0.5 student?"
  status: active
  started: "2026-09-11"
  domain: "robot policy distillation"

literature:
  key_papers:
    - id: acpd2027
      title: "AAAI 2027 ACPD manuscript"
      source: "AAAI_2027_ACPD.pdf"
      relevance: "Defines the privileged-cue selector, variance regularizer, ACL, and training objective."
  open_problems:
    - "Memory and throughput of a frozen full teacher plus a LoRA student on four 32 GB GPUs."
  evidence_gaps:
    - "H11 task-success evaluation is pending."
    - "The matched physical-BS64 backview-only SFT baseline needs task-success evaluation."
    - "The positive H8 and H9 5K results each have one seed and one student view."

hypotheses:
  - id: H1
    statement: "FSDP4 with global micro-batch 8 and four accumulation steps can run ACPD LoRA with effective batch size 32 without OOM."
    status: supported
    motivation: "LoRA removes most student optimizer state while FSDP shards both model states and rematerialization limits activations."
    parent: null
    priority: high
  - id: H2
    statement: "FSDP4 can increase the physical global batch to 32 without gradient accumulation or OOM."
    status: supported
    motivation: "H1 left enough memory headroom to test the complete batch in one optimizer step."
    parent: H1
    priority: high
  - id: H3
    statement: "ACPD at layers 6 and 12 converges faster during the first 5K backview steps than ACPD at either layer alone."
    status: not_supported
    motivation: "The paper selects both layers without reporting a layer ablation; a controlled short run can test whether the additional head improves early optimization."
    parent: H2
    priority: high
  - id: H4
    statement: "Under an otherwise identical LoRA training graph, Cue or ACL changes early supervised-loss convergence relative to flow-only training."
    status: not_supported
    motivation: "The layer comparison cannot establish ACPD efficacy, and the historical SFT log uses a different RNG split. A component ablation inside the same distillation trainer isolates the optimization effect."
    parent: H2
    priority: high
  - id: H5
    statement: "Full ACPD improves pooled four-suite backview success by at least 2 percentage points over trainer-matched Flow-only training at 5K steps."
    status: supported
    motivation: "H4 shows active auxiliary gradients but indistinguishable supervised convergence, so task success is the next discriminating measurement. Promotion also requires the paired episode-bootstrap 95% confidence interval to exclude zero."
    parent: H4
    priority: high
  - id: H7
    statement: "An adapted backview student can predict the teacher's exact per-view attention contribution on held-out episodes, especially where the privileged teacher has the largest flow-error advantage."
    status: supported
    motivation: "The old learned cue and heuristic visual proxy admit shortcuts; exact Q/K/V attention contributions provide a fixed privileged target and a same-query shuffled-view control."
    parent: H5
    priority: high
  - id: H8
    statement: "ACL-only explains less than the complete +2.05-point H5 task-success gain at 5K steps."
    status: not_supported
    motivation: "H5 supports the full objective, but Cue and ACL were changed together. A matched saved ACL-only checkpoint isolates the strongest component from H4."
    parent: H5
    priority: high
  - id: H9
    statement: "A recoverability-gated ACPD-v2 policy improves pooled 5K task success over ACL-only by at least 1.5 percentage points with a positive paired confidence bound."
    status: supported
    motivation: "Deploy the layer-10 target selected by H7.1 using physical global batch 32, then compare its task success with the matched ACL-only baseline."
    parent: H7
    priority: high
  - id: H9-scale-b
    statement: "Layer-10 ACPD-v2 can increase throughput on four RTX 5090 GPUs by using physical global batch 64 without gradient accumulation."
    status: active
    motivation: "Use the memory headroom observed at BS32 to test a higher-throughput H9 training configuration."
    parent: H9
    priority: medium
  - id: H7.1
    statement: "Layer 9 remains the best recoverable layer when every action-expert layer from 6 through 12 is compared under the fixed H7 protocol."
    status: not_supported
    motivation: "The coarse H7 scan cannot distinguish a robust middle-layer optimum from an isolated result; adding layers 7, 8, 10, and 11 completes the local comparison without another policy run."
    parent: H7
    priority: medium
  - id: H10
    statement: "Calibrate ACPD-v2 auxiliary-loss weights after selecting the injection structure."
    status: deferred
    motivation: "Weight comparisons are interpretable only after the deployed contribution path is fixed."
    parent: H9
    priority: medium
  - id: H11
    statement: "Predicting and injecting the contribution after layer-10 attention improves 5K task success over final-hidden fusion."
    status: active
    motivation: "A contribution produced at layer 10 may be more useful when the remaining transformer computation can integrate it."
    parent: H9
    priority: high
  - id: H12
    statement: "Layer-10 ACPD-v2 improves pooled 5K task success over standard backview-only SFT under matched four-device physical batch size 64."
    status: active
    motivation: "The 23.15% H9-scale-b result needs a baseline with the same batch size, optimizer steps, seed, initialization, and learning-rate schedule."
    parent: H9-scale-b
    priority: high

