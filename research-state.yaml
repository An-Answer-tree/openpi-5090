evidence_gaps:
  - "H7.1 layer 10 versus layer 11 needs an independent-seed paired probe if the layer choice must be claimed as statistically superior; current point-margin selection is sufficient only for engineering selection."
  - "Matched H9 and SFT 20K evaluations must locate whether the ACPD-v2 early advantage remains at 20K."
  - "ACL-only must be rerun at BS64 for the final fair ablation."
  - "H17 nonzero contribution decay has partial negative 15K results; its 20K comparison was cancelled and remains unresolved."
  - "A flow-trained adapter after the detached contribution is needed only if lowering the contribution weight does not help."
  - "Whether teacher contribution contains student-unidentifiable components is open; action-direction probe and same-checkpoint closed-loop injection are the next low-cost tests."
  - "Whether direct teacher-action MSE improves over ACL at 5K is open; smoke 136967 passed and formal training 136914 is queued."

constraints:
  - "Do not move or delete datasets or checkpoints."
  - "Do not modify paths used by running, pending, or dependency jobs."
  - "Curate only completed checkpoints with same-filesystem hard links."
  - "Use save_interval=5000 and keep_period=1 for future 30K distillation runs."
  - "Do not recursively scan large checkpoint, log, dataset, or video trees."

